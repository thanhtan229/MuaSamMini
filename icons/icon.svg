<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Shopping Basket / Bag Illustration -->
  <g filter="url(#shadow)" transform="translate(64, 72)">
    <!-- Cart / Basket Body -->
    <path d="M 64 128 L 320 128 C 334 128 346 138 348 152 L 368 280 C 370 298 356 314 338 314 L 46 314 C 28 314 14 298 16 280 L 36 152 C 38 138 50 128 64 128 Z" fill="#ffffff" />

    <!-- Basket Handles -->
    <path d="M 120 128 C 120 75 152 42 192 42 C 232 42 264 75 264 128" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" />

    <!-- Checkmark on Cart -->
    <path d="M 140 220 L 176 254 L 246 184" fill="none" stroke="#0284c7" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
